<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="styler.css">
</head>

<body>
    <div class="container">
        <form>
            <h1>Login</h1>

            <div>
                <label for="first" style="display:block">Username</label>
                <input type="text" placeholder="Enter your name" id="first" name="username" style="display:block">
            </div>

            <div>
                <label for="second" style="display:block">Password</label>
                <input type=" password" placeholder="Enter your password" id="second" name="password"
                    style="display:block">
            </div>
            <button>Login</button>
        </form>
    </div>
</body>

</html>
