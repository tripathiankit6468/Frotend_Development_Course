<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css
    ">
</head>

<body>
    <div class="container">

        <form>
            <h1>SignUp</h1>
            <div>
                <label for="first" styles="display:block">Username</label>
                <input type="text" id="first" placeholder="Enter your name" name="username" style="display:block">
            </div>
            <div>
                <label for="second" styles="display:block">Email</label>
                <input type="email" id="second" placeholder="Enter your email" name="email" style="display:block">
            </div>

            <div>
                <label for="third" styles="display:block">Password</label>
                <input type="password" id="third" placeholder="Enter your password" name="password"
                    style="display:block">

            </div>
            <div>
                <label for="fourth" styles="display:block">Confirm Password</label>
                <input type="password" id="fourth" placeholder="Confirm your password" name="cpassword"
                    style="display:block">

            </div>


        </form>

        <button>SignUp</button>

    </div>
</body>

</html>
