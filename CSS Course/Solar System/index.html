<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Background Stars -->
        <div class="stars"></div>

        <!-- Sun -->
        <div class="sun"></div>

        <!-- Mercury -->
        <div class="orbit mercury-orbit">
            <div class="planet mercury"></div>
        </div>

        <!-- Venus -->
        <div class="orbit venus-orbit">
            <div class="planet venus"></div>
        </div>

        <!-- Earth -->
        <div class="orbit earth-orbit">
            <div class="planet earth">

                <!-- Moon -->
                <div class="moon-orbit">
                    <div class="moon"></div>
                </div>

            </div>
        </div>

        <!-- Mars -->
        <div class="orbit mars-orbit">
            <div class="planet mars"></div>
        </div>

        <!-- Jupiter -->
        <div class="orbit jupiter-orbit">
            <div class="planet jupiter"></div>
        </div>

        <!-- Saturn -->
        <div class="orbit saturn-orbit">
            <div class="planet saturn">
                <div class="ring"></div>
            </div>
        </div>

        <!-- Uranus -->
        <div class="orbit uranus-orbit">
            <div class="planet uranus"></div>
        </div>

        <!-- Neptune -->
        <div class="orbit neptune-orbit">
            <div class="planet neptune"></div>
        </div>

        <!-- Planet Labels -->
        <div class="labels">

            <span class="label mercury-label">Mercury</span>
            <span class="label venus-label">Venus</span>
            <span class="label earth-label">Earth</span>
            <span class="label mars-label">Mars</span>
            <span class="label jupiter-label">Jupiter</span>
            <span class="label saturn-label">Saturn</span>
            <span class="label uranus-label">Uranus</span>
            <span class="label neptune-label">Neptune</span>

        </div>

    </div>

</body>

</html>
