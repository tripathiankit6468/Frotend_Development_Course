<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <h1>Functions</h1>
        <p>Functions package reusable behavior into named or anonymous blocks.</p>
        <input id="name" placeholder="Enter your name" aria-label="Name">
        <button id="greet" type="button">Create greeting</button>
        <output id="message" aria-live="polite">Your greeting will appear here.</output>
    </main>
    <script src="script.js"></script>
</body>

</html>
