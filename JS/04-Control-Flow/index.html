<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Flow and Loops</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <h1>Control Flow & Loops</h1>
        <p>Choose a score to see a conditional statement in action.</p>
        <label for="score">Score from 0 to 100</label>
        <input id="score" type="number" min="0" max="100" value="82">
        <button id="check-score" type="button">Check score</button>
        <output id="result" aria-live="polite">Enter a score.</output>
    </main>
    <script src="script.js"></script>
</body>

</html>
