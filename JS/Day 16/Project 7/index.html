<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Astrology Insights</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Astrology Insights</h1>

            <form>

                <div class="input-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" placeholder="Enter your first name" required>
                </div>

                <div class="input-group">
                    <label for="surname">Surname:</label>
                    <input type="text" id="surname" placeholder="Enter your surname" required>
                </div>

                <div class="input-group">
                    <label for="day">Date of Birth (Day):</label>
                    <input type="number" id="day" name = "day" placeholder="DD" min="1" max="31" required>
                </div>

                <div class="input-group">
                    <label for="month">Month:</label>
                    <input type="number" id="month" name="month"placeholder="MM" min="1" max="12" required>
                </div>

                <div class="input-group">
                    <label for="year">Year:</label>
                    <input type="number" id="year" name="year" placeholder="YYYY" min="1900" max="2023" required>
                </div>

                <button type="submit">Get Insights</button>

                <div id="result"></div>

            </form>

        </div>

    </div>
<script src="./first.js"></script>
</body>

</html>
